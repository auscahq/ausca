[package]
name = "ausca"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rail-neutral buyer client for Ausca's live pay-per-call catalog"
license = "MIT"
repository = "https://github.com/auscahq/ausca"
homepage = "https://ausca.com"
documentation = "https://ausca.com/docs"
readme = "README.md"
keywords = ["ausca", "x402", "agents", "mcp", "payments"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
base64 = "0.22"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
