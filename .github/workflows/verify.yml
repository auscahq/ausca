name: verify

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/ausca/pyproject.toml

      - name: Verify TypeScript packages
        run: npm ci && npm run build && npm test && npm audit --audit-level=high

      - name: Verify Python packages
        run: |
          python -m pip install --disable-pip-version-check build pytest ./python/ausca ./python/langchain-ausca ./python/llama-index-tools-ausca
          python -m pytest python/ausca/tests python/langchain-ausca/tests python/llama-index-tools-ausca/tests
          python -m build python/ausca
          python -m build python/langchain-ausca
          python -m build python/llama-index-tools-ausca
