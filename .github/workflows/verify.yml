name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/ausca/pyproject.toml

      - name: Verify TypeScript packages
        run: npm ci && npm run build && npm test && npm audit --audit-level=high

      - name: Verify Python packages
        run: |
          python -m pip install --disable-pip-version-check build pytest ./python/ausca ./python/langchain-ausca
          python -m pytest python/ausca/tests python/langchain-ausca/tests
          python -m build python/ausca
          python -m build python/langchain-ausca
