name: Publish RubyGem

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version
        required: true
        type: string
  push:
    tags:
      - 'ruby/v*'

permissions:
  contents: read

concurrency:
  group: rubygems-${{ github.event_name == 'workflow_dispatch' && format('ruby/v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: rubygems
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('ruby/v{0}', inputs.version) || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/ruby/v{0}', inputs.version) || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Set up Node for the public contract gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Verify published wire authority
        run: npm run verify:wire

      - name: Verify source and release tag
        working-directory: ruby/ausca
        run: |
          ruby -Ilib test/client_test.rb
          version="$(ruby -rrubygems -e 'print Gem::Specification.load("ausca.gemspec").version')"
          test "${RELEASE_TAG}" = "ruby/v${version}"
          gem build ausca.gemspec
          gem specification "ausca-${version}.gem" name version files

      - name: Import the packed gem with only its declared dependencies
        working-directory: ruby/ausca
        run: |
          gem install "./ausca-${RELEASE_TAG#ruby/v}.gem" --install-dir "$RUNNER_TEMP/ausca-gems" --no-document
          GEM_HOME="$RUNNER_TEMP/ausca-gems" GEM_PATH="$RUNNER_TEMP/ausca-gems" ruby -r ausca -e '
            abort "source checkout masked the packed gem" unless Gem.loaded_specs.fetch("ausca").full_gem_path.start_with?(ENV.fetch("GEM_HOME") + "/")
            puts Ausca::Client.name
          '

      - name: Exchange GitHub identity for a scoped RubyGems token
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish verified gem
        working-directory: ruby/ausca
        run: gem push "ausca-${RELEASE_TAG#ruby/v}.gem"
